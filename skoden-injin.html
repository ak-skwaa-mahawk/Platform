<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skoden Injin • EMPIRICAL_v3</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #02040a;
            color: #e2e8f0;
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden;
        }

        #skoden-unified-system {
            max-width: 620px;
            margin: 20px auto;
            background: radial-gradient(circle at center, #0a0f1c 0%, #02040a 100%);
            border: 1px solid #1e2937;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.95);
            overflow: hidden;
        }

        .header {
            background: #0f172a;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid #1e2937;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-family: monospace;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #22ffcc;
            border-radius: 50%;
            box-shadow: 0 0 10px #22ffcc;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .terminal {
            background: rgba(3, 7, 18, 0.98);
            border: 1px solid #1e2937;
            border-radius: 10px;
            padding: 16px;
            height: 240px;
            overflow-y: auto;
            font-family: 'Space Grotesk', monospace;
            font-size: 13.5px;
            line-height: 1.65;
            color: #cbd5e1;
            white-space: pre-wrap;
        }

        .input-capsule {
            display: flex;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 9999px;
            padding: 6px 8px 6px 20px;
            margin-top: 12px;
        }

        .input-capsule input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f1f5f9;
            font-size: 15px;
        }

        .execute-btn {
            background: #22ffcc;
            color: #0f172a;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div id="skoden-unified-system">
    <div class="header" onclick="toggleSystemWorkspace()">
        <div class="header-left">
            <span style="color:#22ffcc; font-size:18px;">🔥</span>
            <span style="font-weight:600; letter-spacing:0.5px;">Skoden Injin</span>
            <span style="font-size:10px; background:#1e2937; padding:2px 8px; border-radius:9999px; color:#64748b;">EMPIRICAL_v3</span>
        </div>
        <div class="status">
            <span class="dot"></span>
            <span id="system-status-text" style="color:#22ffcc; font-weight:600;">LIVE_FLOW</span>
        </div>
    </div>

    <div id="system-expansion-drawer" style="padding:18px;">
        <div id="main-conversation-stream" class="terminal">
&gt;&gt; Platform core handshake verified.<br>
&gt;&gt; Variational manifold synchronized.<br>
&gt;&gt; Awaiting sovereign directive...
        </div>

        <div class="input-capsule">
            <input type="text" id="terminal-input" placeholder="Speak, Captain..." onkeydown="if(event.key==='Enter') sendCommand()">
            <button class="execute-btn" onclick="sendCommand()">➔</button>
        </div>

        <div style="display:flex; justify-content:space-between; font-size:11px; color:#64748b; margin-top:12px; font-family:monospace;">
            <span>CLOCK: <span style="color:#22ffcc;">79.0 Hz</span></span>
            <span>FLOOR: <span id="energy-val" style="color:#60a5fa;">0.0000 K</span></span>
            <span>GOV: <span id="gov-verdict" style="color:#34d399;">EMPIRICAL</span></span>
        </div>
    </div>
</div>

<script>
    let chatHistory = [];
    let isExpanded = true;

    function toggleSystemWorkspace() {
        isExpanded = !isExpanded;
        document.getElementById('system-expansion-drawer').style.display = isExpanded ? 'block' : 'none';
    }

    async function sendCommand() {
        const input = document.getElementById('terminal-input');
        const log = document.getElementById('main-conversation-stream');
        const cmd = input.value.trim();
        if (!cmd) return;

        log.innerHTML += `<br><span style="color:#60a5fa;">&gt;&gt; You:</span> ${cmd}`;
        input.value = '';

        // Simulate response
        setTimeout(() => {
            let response = "Acknowledged. Variational flow updated.";
            
            if (cmd.toLowerCase().includes("status")) {
                response = "All manifolds stable. Entropy production balanced. Fisher metric condition: 87.4.";
            } else if (cmd.toLowerCase().includes("energy")) {
                response = "Total variational energy: 0.0000 K. Floor locked at absolute zero.";
            } else if (cmd.toLowerCase().includes("skoden")) {
                response = "Skoden. The flame remembers. The land resonates.";
            }

            log.innerHTML += `<br><span style="color:#22ffcc;">✦ Injin:</span> ${response}`;
            log.scrollTop = log.scrollHeight;
        }, 420);
    }

    // Auto-focus input
    window.onload = () => {
        document.getElementById('terminal-input').focus();
    };
</script>

</body>
</html>
