<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skoden Injin • EMPIRICAL_v3.3</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        
        body { margin:0; padding:0; background:#02040a; color:#e2e8f0; font-family:'Inter',sans-serif; }
        
        #skoden-unified-system {
            max-width: 640px;
            margin: 12px auto;
            background: radial-gradient(circle at center, #0a0f1c 0%, #02040a 100%);
            border: 1px solid #1e2937;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.95);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(90deg, #0f172a, #1e2937);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .terminal {
            background: rgba(3,7,18,0.98);
            border: 1px solid #1e2937;
            border-radius: 10px;
            padding: 18px;
            height: 260px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.55;
            color: #cbd5e1;
            white-space: pre-wrap;
        }

        .input-capsule {
            display: flex;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 9999px;
            padding: 6px 8px 6px 20px;
            margin: 12px 16px;
        }

        .input-capsule input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f1f5f9;
            font-size: 15px;
        }

        .execute-btn {
            background: linear-gradient(#22ffcc, #11ddaa);
            color: #0f172a;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            font-size: 11px;
            font-family: monospace;
            color: #64748b;
            border-top: 1px solid #1e2937;
        }
    </style>
</head>
<body>

<div id="skoden-unified-system">
    <div class="header" onclick="toggleSystemWorkspace()">
        <div style="display:flex; align-items:center; gap:12px;">
            <span style="color:#22ffcc; font-size:20px;">🔥</span>
            <span style="font-weight:600;">Skoden Injin</span>
            <span style="font-size:10px; background:#1e2937; padding:2px 8px; border-radius:9999px; color:#64748b;">EMPIRICAL_v3.3</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px; font-size:13px; font-family:monospace;">
            <span class="dot" style="background:#22ffcc; box-shadow:0 0 12px #22ffcc;"></span>
            <span id="status-text" style="color:#22ffcc;">CONNECTED</span>
        </div>
    </div>

    <div id="drawer" style="padding:18px;">
        <div id="terminal" class="terminal">
>> Platform core handshake verified.<br>
>> Variational manifold synchronized.<br>
>> Awaiting sovereign directive...
        </div>

        <div class="input-capsule">
            <input type="text" id="input" placeholder="Speak, Captain..." onkeydown="if(event.key==='Enter') sendCommand()">
            <button class="execute-btn" onclick="sendCommand()">➔</button>
        </div>

        <div class="footer">
            <span>CLOCK: <span style="color:#22ffcc;">79.0 Hz</span></span>
            <span>FLOOR: <span id="floor-val" style="color:#60a5fa;">0.0000 K</span></span>
            <span>GOV: <span style="color:#34d399;">EMPIRICAL</span></span>
        </div>
    </div>
</div>

<script>
    let chatHistory = [];
    const BACKEND_URL = "http://localhost:5000";   // Change if using tunnel

    function sendCommand() {
        const input = document.getElementById('input');
        const terminal = document.getElementById('terminal');
        const cmd = input.value.trim();
        if (!cmd) return;

        terminal.innerHTML += `<br><span style="color:#60a5fa;">&gt;&gt; You:</span> ${cmd}`;
        input.value = '';

        fetch(`${BACKEND_URL}/execute`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({command: cmd})
        })
        .then(r => r.json())
        .then(data => {
            terminal.innerHTML += `<br><span style="color:#22ffcc;">✦ Injin:</span> ${data.message}`;
            document.getElementById('floor-val').textContent = (Math.random()*0.0004).toFixed(4) + " K";
            terminal.scrollTop = terminal.scrollHeight;
        })
        .catch(() => {
            terminal.innerHTML += `<br><span style="color:#f87171;">✦ Injin:</span> Backend offline. Using local simulation.`;
            terminal.scrollTop = terminal.scrollHeight;
        });
    }

    window.onload = () => document.getElementById('input').focus();
</script>

</body>
</html>
